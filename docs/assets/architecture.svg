<svg width="1100" height="680" viewBox="0 0 1100 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ResearchMacha architecture diagram</title>
  <desc id="desc">A diagram showing the React workbench, FastAPI backend, agent tools, LangChain model layer, MySQL, Qdrant, and PDF processing pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBF6EF"/>
      <stop offset="1" stop-color="#EEE2D2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#24160C"/>
      <stop offset="1" stop-color="#A44F2A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#39210E" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A44F2A"/>
    </marker>
  </defs>

  <rect width="1100" height="680" rx="34" fill="url(#bg)"/>
  <circle cx="120" cy="95" r="170" fill="#D08C60" opacity="0.18"/>
  <circle cx="1010" cy="410" r="190" fill="#5E8C7B" opacity="0.14"/>

  <text x="60" y="72" fill="#24160C" font-family="Georgia, serif" font-size="38" font-weight="700">ResearchMacha</text>
  <text x="60" y="104" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="16">Agentic RAG research workbench with explainable tools, memory, and vector retrieval</text>

  <g filter="url(#shadow)">
    <rect x="60" y="155" width="250" height="145" rx="22" fill="#FFF9F1" stroke="#DCC9B7"/>
    <text x="88" y="198" fill="#24160C" font-family="Georgia, serif" font-size="24" font-weight="700">React Workbench</text>
    <text x="88" y="230" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Research</text>
    <text x="88" y="252" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">PDF.js Reader</text>
    <text x="88" y="274" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Batch Summary</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="425" y="140" width="260" height="175" rx="24" fill="#FFF9F1" stroke="#DCC9B7"/>
    <text x="455" y="184" fill="#24160C" font-family="Georgia, serif" font-size="24" font-weight="700">FastAPI Backend</text>
    <text x="455" y="218" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Workflow endpoints</text>
    <text x="455" y="240" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">PDF analysis jobs</text>
    <text x="455" y="262" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Retrieval-grounded chat</text>
    <text x="455" y="284" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Fallback visibility</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="795" y="150" width="245" height="155" rx="22" fill="#24160C"/>
    <text x="824" y="194" fill="#FFF9F1" font-family="Georgia, serif" font-size="24" font-weight="700">LangChain Layer</text>
    <text x="824" y="228" fill="#EBDCC9" font-family="Arial, sans-serif" font-size="14">Ollama / OpenAI adapters</text>
    <text x="824" y="250" fill="#EBDCC9" font-family="Arial, sans-serif" font-size="14">Structured JSON chains</text>
    <text x="824" y="272" fill="#EBDCC9" font-family="Arial, sans-serif" font-size="14">Retry and fallback</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="390" width="240" height="170" rx="22" fill="#FFF9F1" stroke="#DCC9B7"/>
    <text x="110" y="432" fill="#24160C" font-family="Georgia, serif" font-size="23" font-weight="700">Agent Tools</text>
    <text x="110" y="466" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">plan_search</text>
    <text x="110" y="488" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">search_arxiv / rank</text>
    <text x="110" y="510" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">select / import / analyze</text>
    <text x="110" y="532" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">synthesize_brief</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="430" y="390" width="245" height="170" rx="22" fill="#FFF9F1" stroke="#DCC9B7"/>
    <text x="462" y="432" fill="#24160C" font-family="Georgia, serif" font-size="23" font-weight="700">MySQL</text>
    <text x="462" y="466" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Papers, chunks, jobs</text>
    <text x="462" y="488" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Agent runs and steps</text>
    <text x="462" y="510" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Memory source of truth</text>
    <text x="462" y="532" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Fallback embeddings</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="795" y="390" width="245" height="170" rx="22" fill="#FFF9F1" stroke="#DCC9B7"/>
    <text x="826" y="432" fill="#24160C" font-family="Georgia, serif" font-size="23" font-weight="700">Qdrant</text>
    <text x="826" y="466" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Paper chunk vectors</text>
    <text x="826" y="488" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Memory vectors</text>
    <text x="826" y="510" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Semantic retrieval</text>
    <text x="826" y="532" fill="#6F5A4A" font-family="Arial, sans-serif" font-size="14">Rebuildable index</text>
  </g>

  <path d="M310 228 C355 228 380 228 425 228" stroke="#A44F2A" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M685 225 C728 225 752 225 795 225" stroke="#A44F2A" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M552 315 L552 390" stroke="#A44F2A" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M425 472 C380 472 365 472 320 472" stroke="#A44F2A" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M675 472 C720 472 750 472 795 472" stroke="#A44F2A" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M917 390 C917 350 917 332 917 305" stroke="#A44F2A" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="605" width="980" height="42" rx="21" fill="url(#accent)" opacity="0.92"/>
  <text x="92" y="632" fill="#FFF9F1" font-family="Arial, sans-serif" font-size="15">Core idea: the LLM decides plans, selections, and synthesis; deterministic services execute tools, persist state, and expose traces.</text>
</svg>
