[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-macha-api"
version = "0.1.0"
description = "FastAPI backend for ResearchMacha"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "langchain>=0.3.27",
  "langchain-core>=0.3.72",
  "langchain-ollama>=0.3.5",
  "langchain-openai>=0.3.28",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "pymysql>=1.1.1",
  "pypdf>=5.0.1",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0.35",
  "uvicorn[standard]>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
